---
layout: default
---

<article class="post">
  <header>
    <p class="date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="entry">{{ content }}</div>
  <p class="back-link"><a href="{{ '/' | relative_url }}">&larr; All writing</a></p>
</article>
