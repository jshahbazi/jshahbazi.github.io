---
layout: default
---

<article class="panel page-shell">
  <header class="page-header">
    <span class="tag tag-fill">{{ page.eyebrow | default: 'Profile' }}</span>
    <h1>{{ page.title | escape }}</h1>
    {% if page.lede %}<p class="page-lede">{{ page.lede }}</p>{% endif %}
  </header>

  <hr class="rule">

  <div class="entry">
    {{ content }}
  </div>
</article>
