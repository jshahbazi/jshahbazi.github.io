name: John Shahbazian
title: John Shahbazian
description: Notes on software and systems.
url: https://jshahbazi.github.io
baseurl: ""
avatar: https://avatars.githubusercontent.com/u/4032258?s=140
lang: en
timezone: America/New_York

markdown: kramdown
highlighter: rouge
# Preserve existing article URLs.
permalink: /:title
excerpt_separator: "<!--more-->"

plugins:
  - jemoji
  - jekyll-sitemap

sass:
  sass_dir: _sass
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - scripts
  - AGENTS.md
